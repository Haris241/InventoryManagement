<form [formGroup]="login">
    <div class="containerr">
        <div class="flex justify-center mt-4">
            <img src="/Logo.png" alt="Inventory Management System Logo" class="logo">
        </div>
        <div class="mt-4 md:mx-10 mx-5">
            <p class="text-2xl text-center global-color font-bold ">Welcome Back!</p>
        </div>
        <div class="mb-4 md:mx-10 mx-5">
            <p class="text-sm text-center text-black">From stockroom to storefront — we’ve got your inventory
                covered</p>
        </div>
        <div class="my-4 md:mx-10 mx-5">
            <label class="global-color" for="name">Username</label>
            <div class="w-full">
                <input pInputText pSize="small" id="userName" autocomplete="off" type="text" formControlName="userName"
                    class="w-full" placeholder="Enter your Username">
                @if (submit && login.get('userName')?.invalid) {
                <small style="color: red;">UserName is required</small>
                }
            </div>
        </div>
        <div class="mt-4 md:mx-10 mx-5">
            <label class="global-color" for="password">Password</label>
            <div class="w-full">
                <input pInputText pSize="small" id="password" autocomplete="off" type="text" formControlName="password"
                    class="w-full" placeholder="Enter Your Password">
                @if (submit && login.get('password')?.invalid) {
                <small style="color: red;">Password is required</small>
                }
            </div>
        </div>
        <div class="my-2 md:mx-10 mx-5 flex justify-end">
            <a href="" class="text-sm global-color hover:underline">Forgot Password?</a>
        </div>
        <div class="my-4 md:mx-10 mx-5">
            <button class="login-button">Login Now</button>
        </div>
        <div class="mt-4 mb-2 md:mx-10 mx-5">
            <p class="text-sm text-center text-black">Don't have any account?</p>
        </div>
        <div class="mb-10 md:mx-10 mx-5 flex justify-center ">
            <a routerLink="/register" class="text-sm font-bold global-color  hover:underline">Register Now</a>
        </div>
    </div>
</form>
