<!-- Client Setting Edit Form -->
<form (ngSubmit)="updateClientSetting($event)">
    <div class="flex flex-wrap global-div p-5">
        <div class="w-full mb-4">
            <h3 class="text-2xl font-semibold text-center mb-3">
                <span class="gradient-heading">Edit Client Setting</span>
            </h3>
            <hr class="second-color">
        </div>

        <div class="w-full mb-3">
            <div class="lg:w-1/2 w-full">
                <p class="note-banner">Note: Name and Logo will be Used on Reporting. </p>
            </div>
        </div>


        <div class="lg:w-1/4 w-full mb-3">
            <p-floatLabel variant="on">
                <div class="lg:w-8/12 w-full">
                    <input pInputText pSize="small" id="name" autocomplete="off" type="text" class="w-full"
                        [formField]="clientSettingForm.name">
                    <label for="name">Name</label>
                </div>
            </p-floatLabel>
            <app-field-errorS [field]="clientSettingForm.name" [submit]="formSubmitted()"
                [backendErrors]="backendErrors()">
            </app-field-errorS>
        </div>

        <!-- Upload Image -->
        <div class="lg:w-1/4 w-full mb-3">
            <label class="block mb-2">Upload Logo</label>

            <label for="productImage" class="uploadImage">
                <span class="material-symbols-outlined">Upload</span>
                <span>Select Image</span>
            </label>

            <input id="productImage" type="file" accept="image/jpeg,image/png,image/webp" class="hidden"
                (change)="onImageSelected($event)">
        </div>

        <!-- Image Preview -->
        <div class="lg:w-1/2 w-full mb-3">
            <label class="block mb-2">Client Logo</label>

            @if (imagePreview()) {
            <div class="image-preview-container">
                <img [src]="imagePreview()" alt="Preview" class="image-preview" />
                <button type="button" class="btn-remove-image">
                    ✕ Remove
                </button>
            </div>
            }
        </div>



        <div class="w-full flex justify-center m-3">
            <button class="global-button" type="submit" [disabled]="submit()">
                {{ submit() ? 'Processing...' : 'Update' }}
            </button>
        </div>
    </div>
</form>
