<h2 class="text-center text-semibold text-3xl WhiteC">Products</h2>
<div class="flex flex-wrap global-div mt-4 p-4">
    <div class="w-full">
        <div class="flex justify-center">
            <div class="global-search m-3">
                <i class="pi pi-search"></i>
                <input type="text" (input)="dt?.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Search" />
            </div>
        </div>
        <p-table #dt [value]="products()" [globalFilterFields]="['name']" [paginator]="true" [rows]="10"
            [tableStyle]="{ 'min-width': '50rem' }" [rowsPerPageOptions]="[5,10,20]">
            <ng-template pTemplate="header">
                <tr>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-product>
                <tr>
                    <td>{{product.name}}</td>
                    <td>{{product.Quantity}}</td>
                    <td>{{product.price}}</td>
                    <td>
                        <a class="me-3" routerLink=""><span class="material-symbols-outlined second-color">edit</span></a>
                        <button (click)="deleteProduct(product.id)"><span class="material-symbols-outlined second-color">delete</span></button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
