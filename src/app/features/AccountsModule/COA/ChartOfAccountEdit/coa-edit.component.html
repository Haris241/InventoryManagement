<!-- COA Edit Form -->
<form (ngSubmit)="updateCOA($event)">
    <div class="flex flex-wrap global-div p-5">
        <div class="w-full mb-4">
            <h3 class="text-2xl font-semibold text-center mb-3">
                <span class="gradient-heading">Edit Chart of Account</span>
            </h3>
            <hr class="second-color">
        </div>
        <div class="lg:w-1/4 w-full mb-3">
            <p-floatLabel variant="on">
                <div class="lg:w-8/12 w-full">
                    <input pInputText pSize="small" id="name" autocomplete="off" type="text" class="w-full"
                        [formField]="coaEditForm.name">
                    <label for="name">Name</label>
                </div>
            </p-floatLabel>
            <app-field-errorS [field]="coaEditForm.name" [submit]="formSubmitted()" [backendErrors]="backendErrors()">
            </app-field-errorS>
        </div>

        <div class="lg:w-1/4 w-full mb-3">
            <div class="lg:w-1/2 w-full">
                <div class="flex items-center gap-2">
                    <input id="isActive" type="checkbox" [formField]="coaEditForm.isActive" class="w-auto" />
                    <label for="isActive" class="mb-0 !text-lg font-medium gradient-heading">Active</label>
                </div>
            </div>
        </div>

        <div class="lg:w-1/4 w-full mb-3">
            <p-floatLabel variant="on">
                <div class="lg:w-8/12 w-full">
                    <input pInputText pSize="small" [value]="coaDetail()?.code" class="w-full cursor-not-allowed"
                        readonly>
                    <label>Code</label>
                </div>
            </p-floatLabel>
        </div>

        <div class="lg:w-1/4 w-full mb-3">
            <p-floatLabel variant="on">
                <div class="lg:w-8/12 w-full">
                    <input pInputText pSize="small" [value]="coaDetail()?.category" class="w-full cursor-not-allowed"
                        readonly>
                    <label>Category</label>
                </div>
            </p-floatLabel>
        </div>

        <div class="lg:w-1/4 w-full mb-3">
            <p-floatLabel variant="on">
                <div class="lg:w-8/12 w-full">
                    <input pInputText pSize="small" [value]="coaDetail()?.kind" class="w-full cursor-not-allowed"
                        readonly>
                    <label>Kind</label>
                </div>
            </p-floatLabel>
        </div>

        <div class="w-full mb-3">
            <div class="lg:w-1/2 w-full">
                <p class="note-banner">Note: First uncheck "Active" to deactivate this account, then select the
                    checkbox below to also deactivate all child accounts.</p>
            </div>
        </div>


        <div class="w-full mb-3">
            <div class="lg:w-1/2 w-full">
                <div class="flex items-center gap-2">
                    <input id="deactivateChildren" type="checkbox" [formField]="coaEditForm.deactivateChildren"
                        class="w-auto" />
                    <label for="deactivateChildren" class="mb-0 !text-lg font-medium gradient-heading">Deactivate
                        Children</label>
                </div>
            </div>
        </div>
        <div class="w-full flex justify-center m-3">
            <button class="global-button" type="submit" [disabled]="submit()">
                {{ submit() ? 'Processing...' : 'Update Chart of Account' }}
            </button>
        </div>
    </div>
</form>
