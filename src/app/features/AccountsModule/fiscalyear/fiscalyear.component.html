<!-- Fiscal Year Create Form -->
<form (ngSubmit)="createFiscalYear($event)">
  <div class="flex flex-wrap global-div p-5">
    <div class="w-full mb-4">
      <h3 class="text-2xl font-semibold text-center second-color mb-3">Add Fiscal Year</h3>
      <hr class="second-color">
    </div>
    <div class="lg:w-1/4 w-full mb-3">
      <p-floatLabel variant="on">
        <div class="lg:w-8/12 w-2/3">
          <p-datepicker [(ngModel)]="fiscalYearModel().yearDate" [ngModelOptions]="{standalone: true}"
            (ngModelChange)="updateField('yearDate',$event)" view="year" dateFormat="yy" size="small" showicon
            iconDisplay="input" inputId="yearDate" />
          <label for="yearDate" class="required">Fiscal Year</label>
        </div>
      </p-floatLabel>
      <app-field-errorS [field]="fiscalYearForm.yearDate" [submit]="submit()" [backendErrors]="backendErrors()">
      </app-field-errorS>
    </div>
    <div class="lg:w-1/4 w-full mb-3">
      <p-floatLabel variant="on">
        <div class="lg:w-8/12 w-2/3">
          <input pInputText pSize="small" id="remarks" autocomplete="off" type="text" class="w-full"
            [formField]="fiscalYearForm.remarks">
          <label for="remarks">Remarks</label>
        </div>
      </p-floatLabel>
    </div>

    <div class="lg:w-1/4 w-full mb-3">
      <button class="global-button" type="submit">Add Fiscal Year</button>
    </div>
  </div>
</form>


<!-- Fiscal Year List -->
<div class="flex flex-wrap global-div mt-4 p-4">
  <div class="w-full">
    <p-table #dt [value]="fiscalYears()" [paginator]="true" [rows]="20" [lazy]="true"
      (onLazyLoad)="loadFiscalYears($event)" [totalRecords]="totalrecords()" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Remarks</th>
          <th>Status</th>
          <th>Current Year</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-fiscal>
        <tr>
          <td>{{fiscal.name}}</td>
          <td>{{fiscal.startDate}}</td>
          <td>{{fiscal.endDate}}</td>
          <td>{{fiscal.remarks}}</td>
          <td><span class="status-badge" [ngClass]="getStatusClass(fiscal.status)">
              {{ getStatusLabel(fiscal.status) }}
            </span>
          </td>
          @if (fiscal.isDefault) {
            <td><span class="status-badge status-active">Current Year</span></td>
          }@else{
            <td><button (click)="SwitchYear({ id: fiscal.id })" class="status-badge status-closed">Switch</button></td>
          }
          
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
