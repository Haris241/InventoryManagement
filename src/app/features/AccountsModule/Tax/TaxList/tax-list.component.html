<form (ngSubmit)="OnSearch()">
    <div class="flex flex-wrap global-div p-5">
        <div class="w-full mb-4">
            <h3 class="text-2xl font-semibold text-center mb-3">
                <span class="gradient-heading">Tax List</span>
            </h3>
            <hr class="second-color">
        </div>
        <div class="lg:w-1/4 w-full mb-3">
            <p-floatLabel variant="on">
                <div class="lg:w-10/12 w-full">
                    <p-autoComplete [(ngModel)]="taxFormModel().id" [ngModelOptions]="{standalone: true}"
                        (ngModelChange)="updateField('id',$event)"
                        (completeMethod)="SearchDropDown($event,taxSearch.searchterm)" inputId="id" optionLabel="name"
                        [dropdown]="true" [suggestions]="taxSearchList()" optionValue="id" [showClear]="true"
                        class="w-full"></p-autoComplete>
                    <label for="id">Search by Name</label>
                </div>

            </p-floatLabel>

        </div>
        <div class="lg:w-1/4 w-full mb-3 flex items-center gap-2">
            <input id="isActive" type="checkbox" [formField]="taxForm.isActive" class="w-auto" />
            <label for="isActive" class="mb-0 !text-lg font-medium gradient-heading">Active</label>
        </div>
        <div class="w-full flex justify-center m-3">
            <button class="global-button">Search</button>
        </div>
    </div>
</form>
@if(taxList().length > 0){
<div class="flex flex-wrap global-div mt-4 p-4">
    <div class="w-full">
        <p-table #dt [value]="taxList()" [rows]="20" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template pTemplate="header">
                <tr>
                    <th>Tax Name</th>
                    <th>Rate</th>
                    <th>Description</th>
                    <th>IsRecoverable</th>
                    <th>IsActive</th>
                    <th>CreatedAt</th>
                    <th>Actions</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-tax>
                <tr>
                    <td>{{tax.name}}</td>
                    <td>{{tax.rate}}</td>
                    <td>{{tax.description}}</td>
                    <td>
                        <span class="status-dot" [ngClass]="tax.isRecoverable ? 'active' : 'inactive'"></span>
                    </td>
                    <td>
                        <span class="status-dot" [ngClass]="tax.isActive ? 'active' : 'inactive'"></span>
                    </td>
                    <td>{{ tax.createdAt | date:'yyyy-MM-dd' }}</td>
                    <td>
                        <button class="me-3" (click)="editTax(tax.id)"><span
                                class="material-symbols-outlined icon-color">edit</span></button>
                    </td>

                </tr>
            </ng-template>
        </p-table>
        <div class="flex justify-end mt-3">
            @if(hasPreviousPage()){
            <button class="pagination-button me-3" (click)="loadTaxes('previous')">Previous</button>
            }
            @if(hasNextPage()){
            <button class="pagination-button me-3" (click)="loadTaxes('next')">Next</button>
            }
        </div>

    </div>
</div>
}
