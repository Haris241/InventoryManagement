<form [formGroup]="addproduct" (ngSubmit)="createProduct()">
  <div class="flex flex-wrap global-div p-5">

    <div class="w-full mb-4">
      @if (isEditMode()) {
      <input id="id" autocomplete="off" type="hidden" formControlName="id">
      <h3 class="text-2xl font-semibold text-center second-color mb-3">Edit Product Information</h3>
      } @else {
      <h3 class="text-2xl font-semibold text-center second-color mb-3">Add Product Information</h3>
      }
      <hr class="second-color">
    </div>

    <!-- Product Name -->
    <div class="lg:w-1/2 w-full mb-3">
      <p-floatLabel variant="on">
        <div class="lg:w-1/2 w-2/3">
          <input pInputText pSize="small" id="name" autocomplete="off" type="text" formControlName="name"
            class="w-full">
          <label for="name" class="required">Product Name</label>
        </div>
      </p-floatLabel>
      <app-field-error [form]="addproduct" field="name" [backendErrors]="backendErrors" [submit]="submit"
        [formChange]="formChange">
      </app-field-error>
    </div>

    <!-- Product Price -->
    <div class="lg:w-1/2 w-full mb-3">
      <div class="lg:w-1/2 w-2/3">
        <p-floatLabel variant="on">
          <input pInputText pSize="small" id="price" autocomplete="off" type="number" formControlName="price"
            class="w-full">
          <label for="price" class="required">Product Price</label>
        </p-floatLabel>
        <app-field-error [form]="addproduct" field="price" [backendErrors]="backendErrors" [submit]="submit"
          [formChange]="formChange">
        </app-field-error>
      </div>
    </div>

    <!-- Product Quantity -->
    <div class="lg:w-1/2 w-full mb-3">
      <div class="lg:w-1/2 w-2/3">
        <p-floatLabel variant="on">
          <input pInputText pSize="small" id="quantity" autocomplete="off" type="number" formControlName="quantity"
            class="w-full">
          <label for="quantity">Product Quantity</label>
        </p-floatLabel>
        <app-field-error [form]="addproduct" field="quantity" [backendErrors]="backendErrors" [submit]="submit"
            [formChange]="formChange">
          </app-field-error>
      </div>
    </div>

    <!-- Supplier -->
    <div class="lg:w-1/2 w-full mb-3">
      <div>
      <p-floatLabel variant="on">      
          <p-autoComplete (completeMethod)="SearchSuppliers($event,suppliersearch.searchterm)" inputId="supplierId"
            optionLabel="name" formControlName="supplierId" [dropdown]="true" [suggestions]="suppliers()"
            optionValue="id" [showClear]="true">
          </p-autoComplete>
          <label for="supplierId">Select Supplier</label>
          
      </p-floatLabel>
      <small>Enter atleast 3 Characters</small>
    </div>
    </div>

    <!-- Upload Image -->
    <div class="lg:w-1/2 w-full mb-3">
      <label class="block mb-2">Upload Product Image</label>

      <label for="productImage" class="uploadImage">
        <span class="material-symbols-outlined">Upload</span>
        <span>Select Image</span>
      </label>

      <input id="productImage" type="file" accept="image/jpeg,image/png,image/webp" class="hidden"
        (change)="onImageSelected($event)">
    </div>

    <!-- Image Preview -->
    <div class="lg:w-1/2 w-full mb-3">
      <label class="block mb-2">Product Image</label>

      @if (imagePreview()) {
      <div class="image-preview-container">
        <img [src]="imagePreview()" alt="Preview" class="image-preview" />
        <button type="button" class="btn-remove-image">
          ✕ Remove
        </button>
      </div>
      }
    </div>

    <!-- Submit Button -->
    <div class="lg:w-1/2 w-full mb-3">
      @if (isEditMode()) {
      <button class="global-button">Updtae Product</button>
      } @else {
      <button class="global-button">Add Product</button>
      }
    </div>

  </div>
</form>
