<h2 class="text-center text-semibold text-3xl WhiteC mb-4">Products List</h2>
<form [formGroup]="producSearchForm" (ngSubmit)="OnSearch()">
    <div class="flex flex-wrap global-div p-5">
        <div class="lg:w-1/2 w-full mb-3">
            <span class="WhiteC">Search Product Name</span>
            <div>
                <p-autoComplete (completeMethod)="SearchDropDown($event,productsearch.searchterm)" inputId="productId"
                    optionLabel="name" formControlName="productId" [dropdown]="true" [suggestions]="productByName()"
                    optionValue="id" placeholder="Write 3 Characters " [showClear]="true"></p-autoComplete>
            </div>
        </div>
        <div class="lg:w-1/2 w-full mb-3">
            <span class="WhiteC">Search Supplier</span>
            <div>
                <p-autoComplete (completeMethod)="SearchDropDown($event,suppliersearch.searchterm)" inputId="supplierId"
                    optionLabel="name" formControlName="supplierId" [dropdown]="true" [suggestions]="suppliers()"
                    optionValue="id" placeholder="Write 3 Characters " [showClear]="true"></p-autoComplete>
            </div>
        </div>
        <div class="lg:w-1/2 w-full mb-3">
            <button class="global-button">Search</button>
        </div>
    </div>
</form>
<div class="flex flex-wrap global-div mt-4 p-4">
    <div class="w-full">
        <div class="flex justify-center">
            <div class="global-search m-3">
                <i class="pi pi-search"></i>
                <input type="text" (input)="dt?.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Search" />
            </div>
        </div>
        <p-table #dt [value]="products()"  [globalFilterFields]="['name']" [paginator]="true" [rows]="20" [lazy]="true"
            (onLazyLoad)="loadProducts($event)" [totalRecords]="totalrecords()" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template pTemplate="header">
                <tr>
                    <th>Product Number</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Supplier Name</th>
                    <th>Actions</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-product>
                <tr>
                    <td>{{product.productNumber}}</td>
                    <td>{{product.name}}</td>
                    <td>{{product.price}}</td>
                    <td>{{product.quantity}}</td>
                    <td>{{product.supplierName}}</td>
                    <td>
                        <!-- use same component for edit  -->
                        <button class="me-3" (click)="editProduct(product.id)"><span
                                class="material-symbols-outlined second-color">edit</span></button>
                        <button (click)="deleteProduct(product.id)"><span
                                class="material-symbols-outlined second-color">delete</span></button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
