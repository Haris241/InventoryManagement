<h2 style="text-align: center;">Products</h2>
<div class="row global-div">
    <div class="col-12">
        <div class="d-flex justify-content-center">
            <div class="global-search m-3">
                <i class="pi pi-search"></i>
                <input type="text" (input)="dt?.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Search" />
            </div>
        </div>
        <p-table #dt [value]="products" [globalFilterFields]="['name']" [paginator]="true" [rows]="10"
            [tableStyle]="{ 'min-width': '50rem' }" [rowsPerPageOptions]="[5,10,20]">
            <ng-template pTemplate="header">
                <tr>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-product>
                <tr>
                    <td>{{product.name}}</td>
                    <td>{{product.quantity}}</td>
                    <td>{{product.price}}</td>
                    <td>
                        <a class="me-3" routerLink=""><i class="pi pi-pencil "></i></a>
                        <a routerLink=""><i class="pi pi-trash "></i></a>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
